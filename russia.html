<script>
// Russia-only configuration
const RUSSIA_MODE = true;
const RU_IDS = ['ru_5_36', 'ru_6_45', 'ru_7_49', 'ru_5_50', 'ru_8_20', 'ru_12_24', 'ru_top3', 'ru_keno', 'ru_6_45_plus'];

<script src="script/lotto.js"></script>
<script>
// Override initialization for Russia-only view
function renderRussiaView() {
  if (typeof t === 'function') {
    document.getElementById('h-title').textContent = t('ui_title_ru');
    document.getElementById('h-sub').textContent = t('ui_sub_ru');
  } else {
    document.getElementById('h-title').textContent = '🇷🇺 Russia Lottery Generator';
    document.getElementById('h-sub').textContent = 'Generate winning numbers for lotteries in Russia';
  }

  // Render only Russian lotteries
  if (RUSSIA_MODE) {
    document.getElementById('lottery-grid').innerHTML = LOTTERIES
      .filter(l => RU_IDS.includes(l.id))
      .map(l => l.renderCard(null))
      .join('');
    document.querySelectorAll('.card').forEach((c, i) => {
      c.style.animationDelay = (i * 0.03) + 's';
    });
  }
}

// Hook into lotto.js applyLang to keep Russia view and language updated
const originalApplyLang = window.applyLang;
if (typeof originalApplyLang === 'function') {
  window.applyLang = function() {
    originalApplyLang();
    renderRussiaView();
  };
}

renderRussiaView();
</script>
